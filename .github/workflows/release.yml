name: Release (Python wheels)

# Builds pre-compiled Python wheels for Linux/macOS/Windows and publishes them
# to PyPI on a version tag. Wheels are abi3 (cp38+), so one wheel per platform
# covers every supported CPython.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default; only the publish job opts into id-token below.
permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # QEMU lets the Linux runner also build aarch64 wheels.
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
        env:
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # Smoke test every wheel: load the grammar through py-tree-sitter
          # and parse a snippet (incl. a Dart 3 record).
          CIBW_TEST_REQUIRES: "tree-sitter>=0.23"
          CIBW_TEST_COMMAND: >-
            python -c "import tree_sitter_dart;
            from tree_sitter import Language, Parser;
            t = Parser(Language(tree_sitter_dart.language())).parse(b'class A { (int,String) m() => (1, q); }');
            assert t.root_node.type == 'program' and not t.root_node.has_error"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, make_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      # Pinned to the release/v1 branch (not a SHA) on purpose: PyPA ships
      # security fixes for the OIDC publishing flow there, and pinning to a SHA
      # would freeze us out of them. This is PyPA's own recommendation.
      - uses: pypa/gh-action-pypi-publish@release/v1
