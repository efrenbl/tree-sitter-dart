name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is omitted: `npm install` flakes on Windows when building the
        # native `tree-sitter` node module (EPERM rmdir on node_modules cleanup).
        # The grammar is validated on Linux/macOS here; Windows is still covered
        # for the published artifact by the Python wheel build in release.yml.
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.16.0
      - run: npm install
      - run: npm test