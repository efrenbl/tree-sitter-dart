[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-dart"
description = "Dart grammar for tree-sitter (covers Flutter)"
version = "0.1.0"
authors = [{ name = "Efren Bautista" }]
maintainers = [{ name = "Efren Bautista" }]
keywords = ["incremental", "parsing", "tree-sitter", "dart", "flutter"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed"
]
requires-python = ">=3.8"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/efrenbl/tree-sitter-dart"
Repository = "https://github.com/efrenbl/tree-sitter-dart"
Issues = "https://github.com/efrenbl/tree-sitter-dart/issues"

[project.optional-dependencies]
core = ["tree-sitter>=0.23"]

[tool.cibuildwheel]
build = "cp38-*"
build-frontend = "build"
